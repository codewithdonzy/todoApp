<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Task – TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    /* paste contents of taskflow_styles.css here */
  </style>
</head>
<body>

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sidebar-brand">Task<span>Flow</span></div>
  <div class="sidebar-nav">
    <a href="/" class="nav-link active">
      <i class="bi bi-check2-square"></i> My Tasks
    </a>
    <a href="/tasks/add/" class="nav-link">
      <i class="bi bi-plus-circle"></i> Add Task
    </a>
    <a href="/profile/" class="nav-link">
      <i class="bi bi-person-circle"></i> Profile
    </a>
  </div>
  <div class="sidebar-footer">
    <a href="/logout/"><i class="bi bi-box-arrow-left"></i> Logout</a>
  </div>
</nav>

<!-- MAIN CONTENT -->
<div class="main-content">

  <!-- TOPBAR -->
  <div class="topbar">
    <h4>Edit Task</h4>
    <div class="d-flex align-items-center gap-2">
      <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-white"
           style="width:36px;height:36px;background:#6366f1;font-size:.9rem;">
        J
      </div>
      <span class="fw-semibold text-muted small">johndoe</span>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card">
        <div class="card-header bg-white py-3">
          <h6 class="fw-bold mb-0">
            <i class="bi bi-pencil-square me-2 text-primary"></i>Edit Task
          </h6>
        </div>
        <div class="card-body p-4">
          <form method="post" action="/tasks/1/edit/">
            <!-- add csrf token input here -->
            <div class="mb-3">
              <label class="form-label fw-semibold small">
                Task Title <span class="text-danger">*</span>
              </label>
              <!-- value comes from task.title -->
              <input type="text" name="title" class="form-control"
                     value="Buy groceries" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small">Description</label>
              <!-- content comes from task.description -->
              <textarea name="description" class="form-control" rows="3">Pick up items from the market before 6pm.</textarea>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label fw-semibold small">Priority</label>
                <!-- set "selected" on whichever matches task.priority -->
                <select name="priority" class="form-select">
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold small">Status</label>
                <!-- set "selected" on whichever matches task.status -->
                <select name="status" class="form-select">
                  <option value="pending" selected>Pending</option>
                  <option value="in_progress">In Progress</option>
                  <option value="done">Done</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold small">Due Date</label>
                <!-- value comes from task.due_date formatted as YYYY-MM-DD -->
                <input type="date" name="due_date" class="form-control"
                       value="2025-06-01">
              </div>
            </div>
            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary fw-semibold"
                      style="background:var(--primary);border-color:var(--primary);">
                <i class="bi bi-check-lg me-1"></i>Save Changes
              </button>
              <a href="/" class="btn btn-outline-secondary fw-semibold">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
