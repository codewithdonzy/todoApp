<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Profile – TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    /* paste contents of taskflow_styles.css here */
  </style>
</head>
<body>

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sidebar-brand">Task<span>Flow</span></div>
  <div class="sidebar-nav">
    <a href="/" class="nav-link">
      <i class="bi bi-check2-square"></i> My Tasks
    </a>
    <a href="/tasks/add/" class="nav-link">
      <i class="bi bi-plus-circle"></i> Add Task
    </a>
    <a href="/profile/" class="nav-link active">
      <i class="bi bi-person-circle"></i> Profile
    </a>
  </div>
  <div class="sidebar-footer">
    <a href="/logout/"><i class="bi bi-box-arrow-left"></i> Logout</a>
  </div>
</nav>

<!-- MAIN CONTENT -->
<div class="main-content">

  <!-- TOPBAR -->
  <div class="topbar">
    <h4>Edit Profile</h4>
    <div class="d-flex align-items-center gap-2">
      <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-white"
           style="width:36px;height:36px;background:#6366f1;font-size:.9rem;">
        J
      </div>
      <span class="fw-semibold text-muted small">johndoe</span>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card">
        <div class="card-header bg-white py-3">
          <h6 class="fw-bold mb-0">
            <i class="bi bi-pencil-square me-2 text-primary"></i>Update Your Profile
          </h6>
        </div>
        <div class="card-body p-4">
          <form method="post" action="/profile/edit/">
            <!-- add csrf token input here -->
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold small">First Name</label>
                <!-- value comes from user.first_name -->
                <input type="text" name="first_name" class="form-control" value="John">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Last Name</label>
                <!-- value comes from user.last_name -->
                <input type="text" name="last_name" class="form-control" value="Doe">
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold small">Email</label>
                <!-- value comes from user.email -->
                <input type="email" name="email" class="form-control" value="john@example.com">
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold small">Phone</label>
                <!-- value comes from profile.phone -->
                <input type="text" name="phone" class="form-control"
                       value="+233 55 123 4567" placeholder="+233 XX XXX XXXX">
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold small">Bio</label>
                <!-- content comes from profile.bio -->
                <textarea name="bio" class="form-control" rows="3"
                          placeholder="Tell us a little about yourself…">Just a dev building cool stuff.</textarea>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold small">Avatar Color</label>
                <div class="d-flex align-items-center gap-3">
                  <!-- value comes from profile.avatar_color -->
                  <input type="color" name="avatar_color" class="form-control form-control-color"
                         value="#6366f1" style="width:50px;">
                  <span class="text-muted small">Choose a color for your avatar</span>
                </div>
              </div>
              <div class="col-12 d-flex gap-2 mt-2">
                <button type="submit" class="btn btn-primary fw-semibold"
                        style="background:var(--primary);border-color:var(--primary);">
                  <i class="bi bi-check-lg me-1"></i>Save Changes
                </button>
                <a href="/profile/" class="btn btn-outline-secondary fw-semibold">Cancel</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
