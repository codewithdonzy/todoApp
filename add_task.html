{% extends 'base.html' %}
{% block title %}Add Task – TaskFlow{% endblock %}
{% block page_title %}Add New Task{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header bg-white py-3">
        <h6 class="fw-bold mb-0"><i class="bi bi-plus-circle me-2 text-primary"></i>Create a New Task</h6>
      </div>
      <div class="card-body p-4">
        {% if messages %}
          {% for msg in messages %}
            <div class="alert alert-danger rounded-3">{{ msg }}</div>
          {% endfor %}
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold small">Task Title <span class="text-danger">*</span></label>
            <input type="text" name="title" class="form-control" placeholder="What needs to be done?" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Description</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Add more details…"></textarea>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold small">Priority</label>
              <select name="priority" class="form-select">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold small">Status</label>
              <select name="status" class="form-select">
                <option value="pending" selected>Pending</option>
                <option value="in_progress">In Progress</option>
                <option value="done">Done</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold small">Due Date</label>
              <input type="date" name="due_date" class="form-control">
            </div>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary fw-semibold"
                    style="background:var(--primary);border-color:var(--primary);">
              <i class="bi bi-plus-lg me-1"></i>Add Task
            </button>
            <a href="{% url 'tasks' %}" class="btn btn-outline-secondary fw-semibold">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
