<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delete Task – TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    /* paste contents of taskflow_styles.css here */
  </style>
</head>
<body>

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sidebar-brand">Task<span>Flow</span></div>
  <div class="sidebar-nav">
    <a href="/" class="nav-link active">
      <i class="bi bi-check2-square"></i> My Tasks
    </a>
    <a href="/tasks/add/" class="nav-link">
      <i class="bi bi-plus-circle"></i> Add Task
    </a>
    <a href="/profile/" class="nav-link">
      <i class="bi bi-person-circle"></i> Profile
    </a>
  </div>
  <div class="sidebar-footer">
    <a href="/logout/"><i class="bi bi-box-arrow-left"></i> Logout</a>
  </div>
</nav>

<!-- MAIN CONTENT -->
<div class="main-content">

  <!-- TOPBAR -->
  <div class="topbar">
    <h4>Delete Task</h4>
    <div class="d-flex align-items-center gap-2">
      <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-white"
           style="width:36px;height:36px;background:#6366f1;font-size:.9rem;">
        J
      </div>
      <span class="fw-semibold text-muted small">johndoe</span>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="card border-danger">
        <div class="card-header bg-danger text-white py-3">
          <h6 class="fw-bold mb-0">
            <i class="bi bi-exclamation-triangle me-2"></i>Confirm Deletion
          </h6>
        </div>
        <div class="card-body p-4 text-center">
          <div class="mb-3">
            <i class="bi bi-trash3 text-danger" style="font-size:3rem;"></i>
          </div>
          <p class="fw-semibold mb-1">Are you sure you want to delete this task?</p>

          <!-- Task preview box — populate with task.title and task.description -->
          <div class="alert alert-light border rounded-3 text-start my-3">
            <strong>Buy groceries</strong>
            <p class="text-muted small mb-0 mt-1">Pick up items from the market before 6pm.</p>
          </div>

          <p class="text-muted small">This action cannot be undone.</p>

          <form method="post" action="/tasks/1/delete/"
                class="d-flex gap-2 justify-content-center mt-4">
            <!-- add csrf token input here -->
            <button type="submit" class="btn btn-danger fw-semibold">
              <i class="bi bi-trash me-1"></i>Yes, Delete
            </button>
            <a href="/" class="btn btn-outline-secondary fw-semibold">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
