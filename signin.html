<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In – TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    /* paste contents of taskflow_styles.css here */
  </style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card card shadow-lg p-4 p-md-5 mx-3">

    <div class="text-center mb-4">
      <div class="auth-logo">Task<span>Flow</span></div>
      <p class="text-muted mt-1">Welcome back! Sign in to continue</p>
    </div>

    <!-- Error message (show on invalid credentials) -->
    <div class="alert alert-danger rounded-3">
      Invalid username or password.
    </div>

    <form method="post" action="/signin/">
      <!-- add csrf token input here -->
      <div class="mb-3">
        <label class="form-label fw-semibold small">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="Your username" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold small">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="Your password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold"
              style="background:var(--primary);border-color:var(--primary);">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>
    </form>

    <p class="text-center text-muted mt-4 mb-0 small">
      Don't have an account?
      <a href="/signup/" class="text-decoration-none fw-semibold">Sign Up</a>
    </p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
