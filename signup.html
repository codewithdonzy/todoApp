<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up – TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    /* paste contents of taskflow_styles.css here */
  </style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card card shadow-lg p-4 p-md-5 mx-3">

    <div class="text-center mb-4">
      <div class="auth-logo">Task<span>Flow</span></div>
      <p class="text-muted mt-1">Create your account</p>
    </div>

    <!-- Error message (show when there's a form error) -->
    <div class="alert alert-danger rounded-3">
      Something went wrong. Fix and resubmit.
    </div>

    <form method="post" action="/signup/">
      <!-- add csrf token input here -->
      <div class="row g-3">
        <div class="col-6">
          <label class="form-label fw-semibold small">First Name</label>
          <input type="text" name="first_name" class="form-control" placeholder="John">
        </div>
        <div class="col-6">
          <label class="form-label fw-semibold small">Last Name</label>
          <input type="text" name="last_name" class="form-control" placeholder="Doe">
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold small">Username <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control" placeholder="johndoe" required>
          </div>
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold small">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" class="form-control" placeholder="john@example.com">
          </div>
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold small">Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password1" class="form-control" placeholder="Min 6 characters" required>
          </div>
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold small">Confirm Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" name="password2" class="form-control" placeholder="Repeat password" required>
          </div>
        </div>
        <div class="col-12 mt-2">
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold"
                  style="background:var(--primary);border-color:var(--primary);">
            <i class="bi bi-person-plus me-1"></i> Create Account
          </button>
        </div>
      </div>
    </form>

    <p class="text-center text-muted mt-4 mb-0 small">
      Already have an account?
      <a href="/signin/" class="text-decoration-none fw-semibold">Sign In</a>
    </p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
