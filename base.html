<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    /* paste contents of taskflow_styles.css here */
  </style>
</head>
<body>

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sidebar-brand">Task<span>Flow</span></div>
  <div class="sidebar-nav">
    <a href="/" class="nav-link active">
      <i class="bi bi-check2-square"></i> My Tasks
    </a>
    <a href="/tasks/add/" class="nav-link">
      <i class="bi bi-plus-circle"></i> Add Task
    </a>
    <a href="/profile/" class="nav-link">
      <i class="bi bi-person-circle"></i> Profile
    </a>
  </div>
  <div class="sidebar-footer">
    <a href="/logout/"><i class="bi bi-box-arrow-left"></i> Logout</a>
  </div>
</nav>

<!-- MAIN CONTENT -->
<div class="main-content">

  <!-- TOPBAR -->
  <div class="topbar">
    <h4>Page Title Here</h4>
    <div class="d-flex align-items-center gap-2">
      <!-- Avatar circle: change background color to user's avatar_color -->
      <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-white"
           style="width:36px;height:36px;background:#6366f1;font-size:.9rem;">
        J
      </div>
      <span class="fw-semibold text-muted small">johndoe</span>
    </div>
  </div>

  <!-- FLASH MESSAGE (success) -->
  <div class="alert alert-success alert-dismissible fade show rounded-3 mb-3" role="alert">
    Your message here.
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- FLASH MESSAGE (danger/error) -->
  <div class="alert alert-danger alert-dismissible fade show rounded-3 mb-3" role="alert">
    Error message here.
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- PAGE CONTENT GOES HERE -->

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
